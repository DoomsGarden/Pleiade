name: Visor en GitHub Pages

run-name: "${{ inputs.publish && 'Publicar' || 'Verificar' }} el visor ${{ inputs.release }}"

on:
  workflow_dispatch:
    inputs:
      release:
        description: Etiqueta de una versión publicada, por ejemplo v0.000.00.018
        required: true
        type: string
      publish:
        description: Publicar el visor en GitHub Pages
        type: boolean
        default: false

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  prepare:
    name: Preparar el visor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Comprobar la versión publicada
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]\.[0-9]{3}\.[0-9]{2}\.[0-9]{3}$ ]]; then
            echo '::error::Usa una etiqueta con el formato v0.000.00.000.'
            exit 1
          fi
          published_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq 'select(.draft == false and .published_at != null) | .tag_name')
          if [[ "$published_tag" != "$RELEASE_TAG" ]]; then
            echo '::error::La etiqueta debe corresponder a una versión publicada.'
            exit 1
          fi
      - name: Descargar el visor de la versión
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ inputs.release }}
          sparse-checkout: dist
          persist-credentials: false
      - name: Validar los archivos estáticos
        env:
          RELEASE_TAG: ${{ inputs.release }}
        run: |
          for file in index.html app.js style.css assets/manifest.json assets/scene.json assets/shaders.json; do
            if [[ ! -s "dist/$file" ]]; then
              echo "::error::Falta dist/$file en la versión seleccionada."
              exit 1
            fi
          done
          if [[ -n "$(find dist -type l -print -quit)" ]]; then
            echo '::error::GitHub Pages no admite enlaces simbólicos en el artefacto.'
            exit 1
          fi
          if [[ "$(jq -r .viewer_version dist/assets/manifest.json)" != "${RELEASE_TAG#v}" ]]; then
            echo '::error::La versión del visor difiere de la etiqueta de la publicación.'
            exit 1
          fi
          printf 'Versión del visor: `%s`\n\nCommit: `%s`\n' \
            "$RELEASE_TAG" "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Empaquetar el visor
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    name: Publicar el visor
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
