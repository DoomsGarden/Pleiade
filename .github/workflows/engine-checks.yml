name: Engine checks

on:
  push:
    branches: [main, arquitectura-014]
  pull_request:
    branches: [main, arquitectura-014]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  viewer:
    name: WebGL viewer
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools
          python -m pip install -r requirements.txt
      - name: Verify generated shaders are current
        run: |
          python tools/prepare_shaders.py
          status=$(git status --porcelain -- dist/assets/shaders.json ':(glob)tests/*.glsl')
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status"
            echo '::error::Commit the outputs of python tools/prepare_shaders.py.'
            exit 1
          fi
      - name: Compile and link GLSL ES programs
        run: |
          shaders=$(mktemp -d)
          for pair in geometry:material geometry:shadow fullscreen:composite fullscreen:cloud waterVertex:depthOnly geometry:glass weatherVertex:weather; do
            vertex=${pair%:*}
            fragment=${pair#*:}
            cp "tests/$vertex.glsl" "$shaders/$vertex.vert"
            cp "tests/$fragment.glsl" "$shaders/$fragment.frag"
            glslangValidator -l "$shaders/$vertex.vert" "$shaders/$fragment.frag"
          done
      - name: Test viewer, assets and Android bridge mock
        run: |
          npm test
          PLEIADE_ANDROID_MOCK=1 node tests/runtime_check.mjs

  desktop:
    name: Native C++ renderer
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install build and software rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libegl1 libgl1-mesa-dri
          python -m pip install -r requirements.txt
      - name: Build and run CTest
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
      - name: Render the shore with Mesa
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          python tools/prepare_desktop_demo.py build/materials
          ./build/pleiade --water-demo --cinematic --cinematic-time 3 --headless --frames 2 --width 640 --height 360 \
            --no-hud --no-gpu-timing --frame-gl-checks --asset-dir build/materials \
            --output build/smoke --capture build/smoke/frame.bmp
          test -s build/smoke/frame.bmp

  windows:
    name: Windows x64 build and CTest
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install SDL2, build and run CTest
        shell: pwsh
        run: |
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          & "$vcpkg/vcpkg.exe" install sdl2:x64-windows --disable-metrics
          cmake -S . -B build -A x64 "-DCMAKE_TOOLCHAIN_FILE=$vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows
          cmake --build build --config Release --parallel
          ctest --test-dir build -C Release --output-on-failure
